<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projektets README</title>
    <link rel="stylesheet" href="assets/css/ssi-theme.css" />
    <script src="assets/js/marked.min.js"></script>
    <style>
      .markdown-wrapper {
        max-width: 960px;
        margin: 0 auto;
        background: #fff;
        border-radius: var(--radius-large);
        box-shadow: var(--card-shadow);
        padding: clamp(1.5rem, 2vw, 2.5rem);
      }
      .markdown-wrapper h1:first-child {
        margin-top: 0;
      }
      .loading-state {
        color: var(--text-muted);
        font-style: italic;
      }
      .markdown-wrapper pre {
        background: #0d1117;
        color: #e6edf3;
        padding: 1rem;
        border-radius: 12px;
        overflow-x: auto;
      }
      .markdown-wrapper code {
        font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      }
      .markdown-wrapper table {
        width: 100%;
        border-collapse: collapse;
      }
      .markdown-wrapper table th,
      .markdown-wrapper table td {
        border: 1px solid rgba(15, 23, 42, 0.1);
        padding: 0.6rem 0.8rem;
        text-align: left;
      }
      .markdown-wrapper a {
        color: var(--ssi-blue);
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <p>
          <a href="index.html" style="color: rgba(255, 255, 255, 0.8)"
            >&larr; Tilbage til oversigten</a
          >
        </p>
        <h1>Projektets README</h1>
        <p>
          Den seneste version hentes direkte fra GitHub-repoet, så du altid ser
          den opdaterede dokumentation.
        </p>
      </div>
    </header>
    <main class="content">
      <section class="markdown-wrapper" id="readme">
        <div id="readme-target" class="loading-state">
          Indlæser README...
        </div>
      </section>
    </main>
    <script>
      (function () {
        const target = document.getElementById("readme-target");
        const sources = [
          "../README.md",
          "README.md",
          "https://raw.githubusercontent.com/steenhulthin/vibe-coding-dek-2026/trunk/README.md",
        ];

        async function loadReadme() {
          for (const url of sources) {
            try {
              const response = await fetch(url, { cache: "no-store" });
              if (!response.ok) continue;
              const text = await response.text();
              if (text.trim().length === 0) continue;
              target.classList.remove("loading-state");
              target.innerHTML = marked.parse(text, {
                mangle: false,
                headerIds: true,
              });
              return;
            } catch (error) {
              console.warn("Kunne ikke hente README fra", url, error);
            }
          }
          target.classList.remove("loading-state");
          target.innerHTML =
            "<p>Kunne ikke indlæse README. Prøv at genindlæse siden.</p>";
        }

        loadReadme();
      })();
    </script>
  </body>
</html>
