<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dansk Esri Konference 2026 - Vibe coding præsentation</title>
    <link rel="stylesheet" href="assets/css/ssi-theme.css" />
    <script src="assets/js/marked.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <p>
          <a href="index.html" style="color: rgba(255, 255, 255, 0.8)"
            >&larr; Tilbage til oversigten</a
          >
        </p>
        <h1>Dansk Esri Konference 2026 - Vibe coding præsentation</h1>
        <p>
          Her kan du læse den fulde outline for oplægget og dele den direkte fra
          GitHub Pages.
        </p>
      </div>
    </header>
    <main class="content">
      <section class="markdown-wrapper" id="presentation">
        <div id="markdown-target" class="loading-state">
          Indlæser præsentationen...
        </div>
      </section>
    </main>
    <script>
      (function () {
        const target = document.getElementById("markdown-target");
        const sources = [
          "praesentation.md",
          "../praesentation.md",
          "https://raw.githubusercontent.com/steenhulthin/vibe-coding-dek-2026/trunk/praesentation.md",
        ];

        async function loadMarkdown() {
          for (const url of sources) {
            try {
              const response = await fetch(url, { cache: "no-store" });
              if (!response.ok) continue;
              const text = await response.text();
              if (text.trim().length === 0) continue;
              target.classList.remove("loading-state");
              target.innerHTML = marked.parse(text, {
                mangle: false,
                headerIds: true,
              });
              return;
            } catch (error) {
              console.warn("Kunne ikke hente markdown fra", url, error);
            }
          }
          target.classList.remove("loading-state");
          target.innerHTML =
            "<p>Kunne ikke indlæse præsentationen. Prøv at genindlæse siden.</p>";
        }

        loadMarkdown();
      })();
    </script>
  </body>
</html>
